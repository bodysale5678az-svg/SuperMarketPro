name: C++ CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build SuperMarket Pro
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install g++ and cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake

      - name: Show versions
        run: |
          g++ --version
          cmake --version

      - name: Build with CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Smoke run (startup only)
        run: |
          cd build
          # Feed an immediate quit so the app never blocks
          printf '' | timeout 5 ./SuperMarketPro || echo "Smoke run completed"
